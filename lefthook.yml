# https://lefthook.dev/configuration/
#
# Install the hooks after cloning:  go tool lefthook install

pre-push:
  jobs:
    # Keep `git push` fanning out to both GitHub and GitLab.
    # Git runs pre-push once per push URL, so jobs here must stay cheap.
    # Lefthook always skips a pre-push job when the push carries no changed
    # files. That is fine here: a push with commits in it always carries files,
    # so the guard runs exactly when it can still help.
    - name: dual-remote-push
      run: sh scripts/ensure-dual-push.sh
